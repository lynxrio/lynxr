<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Same strict CSP as the agency app: no inline script or style, nothing
     off-origin, native form posts blocked. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; connect-src 'self' https://api.allorigins.win https://api.codetabs.com https://www.tiktok.com https://www.youtube.com https://esakjfogplfszievvabi.supabase.co https://script.google.com https://script.googleusercontent.com; img-src 'self' https://esakjfogplfszievvabi.supabase.co; media-src 'self' blob:; form-action 'none'; base-uri 'none'; object-src 'none'">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>lynxr — creators</title>
<!-- Link previews. This URL is handed out by hand, so the preview's only job
     is telling the sender which of the two apps they just pasted — the agency
     link is otherwise identical in a message bubble. noindex above still keeps
     it out of search; og tags are read by the messenger, not by a crawler. -->
<meta property="og:title" content="lynxr — creators">
<meta property="og:type" content="website">
<meta property="og:url" content="https://lynxr.io/creatorsonly/">
<meta property="og:image" content="https://lynxr.io/og-creator.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://lynxr.io/og-creator.png">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="alternate icon" type="image/png" sizes="32x32" href="/favicon.png">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="stylesheet" href="/app.css?v=20260821r">
</head>
<body>

<div id="gate">
  <div class="gate-card">
    <h1 class="wordmark"><svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M3 3h3l15 15-3 3L3 6zM21 3v3L6 21l-3-3L18 3z"/></svg><span>lynxr<i>.</i></span></h1>
    <p class="tagline" id="gate-tagline">for creators</p>
    <form class="field login" id="gate-form">
      <input type="email" id="email" placeholder="Email" autofocus
             autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
      <div class="pw-wrap">
        <input type="password" id="pw" placeholder="Password"
               autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false">
        <button type="button" class="toggle" id="toggle-pw" aria-pressed="false" aria-label="Show password" title="Show password">
          <svg class="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>
          </svg>
          <svg class="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M10.6 6.1A9.9 9.9 0 0 1 12 6c6.4 0 10 7 10 7a15.4 15.4 0 0 1-3.1 3.9M6.6 6.6A15.4 15.4 0 0 0 2 13s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/>
            <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><line x1="3" y1="3" x2="21" y2="21"/>
          </svg>
        </button>
      </div>
      <div class="pw-wrap" id="pw2-wrap" hidden>
        <input type="password" id="pw2" placeholder="Confirm password"
               autocomplete="new-password" autocapitalize="none" autocorrect="off" spellcheck="false">
      </div>
      <!-- Shown only when the database says invites are the gate. An invite link
           fills this in, so most people never see it typed. -->
      <div class="pw-wrap" id="invite-wrap" hidden>
        <input type="text" id="invite" placeholder="Invite code"
               autocomplete="one-time-code" autocapitalize="characters" autocorrect="off" spellcheck="false">
      </div>
      <!-- Shown only when creating an account (see setGateMode). Signing in is
           not the moment you agree to anything — you already did. A ticked-by-
           default box would not be agreement at all, so it starts empty and the
           submit is refused without it. -->
      <label class="gate-agree" id="agree-wrap" hidden>
        <input type="checkbox" id="agree">
        <span>i agree to the <a href="/privacy/" target="_blank" rel="noopener">privacy policy</a></span>
      </label>
      <button type="submit" class="btn" id="gate-go">Enter</button>
    </form>
    <div class="err" id="err" role="status" aria-live="polite"></div>
    <p class="gate-other" id="resend-wrap" hidden>
      <button type="button" class="linkish" id="gate-resend">Send me the confirmation link again</button>
    </p>
    <p class="gate-other" id="forgot-wrap">
      <button type="button" class="linkish" id="gate-forgot">Forgot your password?</button>
    </p>
    <p class="gate-switch">
      <span id="switch-lede">Don't have an account?</span>
      <button type="button" class="linkish" id="switch-mode">Create one</button>
    </p>
    <!-- One policy covers all of lynxr, but it has to be reachable from HERE:
         this gate is where an account is created, which is the point the app
         starts collecting an email, a password, and everything the creator goes
         on to put in. A policy linked only from the public home page is not
         reachable from the app at all — a creator handed this URL directly
         never sees that page. -->
    <!-- Agreement is now an explicit tick above, so this is only a way to reach
         the policy — it no longer claims you agreed by being here. -->
    <p class="gate-fine"><a href="/privacy/">privacy policy</a></p>
  </div>
</div>

<div id="app">
  <div class="shell">

    <!-- The rail. Brands sit here like conversations; Library is the one place
         every original video lives, once, across every brand. -->
    <nav class="side" id="side" aria-label="Brands">
      <div class="side-brand">
        <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M3 3h3l15 15-3 3L3 6zM21 3v3L6 21l-3-3L18 3z"/></svg>
        <span class="wordmark"><span>lynxr<i>.</i></span></span>
      </div>


      <!-- Shaped like a chat app: this is the new-chat button. It always lands
           on an empty composer, and that composer is where opening lynxr starts.
           The old "New script" page rendered the same list as the Library, which
           is what made the two feel identical. -->
      <button type="button" class="side-new" id="nav-new">
        <svg class="side-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16.8 3.8a2.1 2.1 0 0 1 3 3L8.5 18.1l-4 1 1-4z"/><path d="M14.5 6.1l3.4 3.4"/></svg>
        New script
      </button>

      <button type="button" class="side-link side-brand-add" id="side-new">
        <svg class="side-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span class="side-label">New brand</span>
      </button>

      <!-- Library sits with the other places you go, rather than up top with
           the one thing you do. Every video ever sent lives here, once, with
           the scripts made from it nested inside. -->
      <button type="button" class="side-link" id="nav-library">
        <svg class="side-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H9v16H5.5A1.5 1.5 0 0 1 4 18.5zM11 4h3.5A1.5 1.5 0 0 1 16 5.5v13a1.5 1.5 0 0 1-1.5 1.5H11z"/><path d="M18.2 5.6l1.9 13.2"/></svg>
        <span class="side-label">Library</span>
        <span class="side-count" id="nav-library-n"></span>
      </button>

      <div class="side-head">Brands</div>
      <div class="side-list" id="side-list"></div>

      <div class="side-foot">
        <!-- Scripts used against the account's allowance. Always visible rather
             than only near the end: a limit you discover at 50 is a wall, and a
             limit you can see from the first script is just how it works. -->
        <div class="side-quota" id="side-quota">
          <span id="side-quota-text"></span>
          <span class="quota-bar" aria-hidden="true"><i id="side-quota-fill"></i></span>
        </div>
        <div class="side-who"><span id="sync-state" class="sync-state"></span> <span id="side-who"></span></div>
        <button type="button" class="side-link" id="nav-feedback">
          <svg class="side-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-3.8-.8L3 21l1.9-5a8.4 8.4 0 0 1-.8-3.6 8.4 8.4 0 0 1 8.4-8.4h.5a8.4 8.4 0 0 1 8 8Z"/></svg>
          <span class="side-label">Feedback</span>
        </button>
        <!-- Sign out lives inside Settings now, not in the rail. It is a rare,
             irreversible-feeling action sitting one slip away from Feedback;
             putting it behind a page keeps it out of thumb range. -->
        <button type="button" class="side-link" id="nav-you">
          <svg class="side-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1Z"/></svg>
          <span class="side-label">Settings</span>
        </button>
      </div>
    </nav>

    <!-- One pane. Everything the app shows is rendered into pane-head and
         pane-body by creator.js — a brand's scripts, the Library, Settings,
         Feedback, the composer. The rail says where you are; this says what. -->
    <main class="pane">
      <!-- Phones only (see .pane-mark): the rail is a drawer there, so this is
           the only lynxr mark on screen once it is closed. -->
      <svg class="pane-mark" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M3 3h3l15 15-3 3L3 6zM21 3v3L6 21l-3-3L18 3z"/></svg>
      <div class="pane-scroll" id="pane-scroll">
        <div class="pane-head" id="pane-head" tabindex="-1"></div>
        <div class="pane-body" id="pane-body"></div>
      </div>
    </main>

  </div>
</div>

<!-- The privacy policy, shown without leaving the page. Deliberately EMPTY: the
     text is fetched from /privacy/ at open time rather than duplicated here, so
     there is exactly one copy of the policy to keep accurate. A second copy
     pasted into this file would be wrong the first time the real one changed,
     and nobody would notice. -->
<div class="modal" id="policy-modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="policy-modal-h">
    <div class="modal-head">
      <span class="modal-title" id="policy-modal-h">privacy policy</span>
      <button type="button" class="ghost icon-only" id="policy-close" aria-label="Close">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="modal-body" id="policy-body" tabindex="0"></div>
  </div>
</div>

<!-- THE TELEPROMPTER. The reading band is first and pinned to the top of the
     viewport on purpose: the front camera sits above the screen, so text read
     from the middle produces footage of someone looking down. Controls go at
     the bottom, out of frame and within thumb reach.
     Everything here is empty — creator.js fills it. No ${...} in this file. -->
<div class="tp" id="tp" hidden>
  <div class="tp-band" id="tp-band">
    <div class="tp-scroll" id="tp-scroll"></div>
    <div class="tp-mark" aria-hidden="true"></div>
  </div>

  <!-- The camera fills the gap between the reading band and the controls. It is
       muted and playsinline on purpose: an unmuted preview feeds the mic back
       through the speaker, and without playsinline iOS takes the video
       fullscreen and covers the teleprompter with it. -->
  <div class="tp-stage" id="tp-stage">
    <video class="tp-cam" id="tp-cam" muted playsinline autoplay></video>
    <span class="tp-dot" id="tp-dot">rec</span>
    <div class="tp-count" id="tp-count" role="status" aria-live="assertive" hidden></div>
  </div>

  <div class="tp-foot">
    <div class="tp-meta">
      <span class="tp-brand" id="tp-brand"></span>
      <!-- Appears once a take exists. A plain download link, not an upload:
           the file goes straight to the device and never touches a server. -->
      <a class="tp-save" id="tp-save" download hidden>save take</a>
      <span class="tp-len" id="tp-len"></span>
    </div>

    <!-- Icon-only, so every aria-label carries the entire meaning: with no text
         inside, a screen reader would announce these as just "button".
         Speed uses chevrons and text size uses the two A's, deliberately NOT
         two identical minus/plus pairs — side by side those are impossible to
         tell apart at a glance, which is the one thing that matters when you
         are reaching for one mid-take. -->
    <div class="tp-row">
      <button type="button" class="ghost icon-only" id="tp-slower" aria-label="Slower" title="Slower">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
          ><path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/></svg>
      </button>
      <span class="tp-rate" id="tp-rate">1.0&#215;</span>
      <button type="button" class="ghost icon-only" id="tp-faster" aria-label="Faster" title="Faster">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
          ><path d="M13 17l5-5-5-5M6 17l5-5-5-5"/></svg>
      </button>

      <span class="tp-gap"></span>

      <button type="button" class="ghost icon-only" id="tp-smaller" aria-label="Smaller text" title="Smaller text">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
          ><path d="M7.5 17l4.5-9 4.5 9M9.4 13.6h5.2"/></svg>
      </button>
      <button type="button" class="ghost icon-only" id="tp-bigger" aria-label="Bigger text" title="Bigger text">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
          ><path d="M4 19l8-14 8 14M7.6 13.5h8.8"/></svg>
      </button>
    </div>

    <div class="tp-row tp-main">
      <button type="button" class="ghost icon-only" id="tp-restart" aria-label="Start again" title="Start again">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
          ><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
      </button>

      <!-- Both faces live in the markup and CSS swaps them on aria-pressed, the
           same way the password eye does. Writing textContent onto this button
           would delete its svg outright — the bug armDelete already shipped
           once, and it is not worth shipping twice. -->
      <button type="button" class="btn tp-play" id="tp-play" aria-pressed="false"
        aria-label="Start recording" title="Start recording">
        <svg class="ico icon-on" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"
          ><circle cx="12" cy="12" r="8"/></svg>
        <svg class="ico icon-off" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"
          ><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
      </button>

      <button type="button" class="ghost icon-only" id="tp-close" aria-label="Done" title="Done">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </div>
</div>

<script src="/dotgrid.js?v=20260821r" defer></script>
<script src="/creator.js?v=20260821r" defer></script>
</body>
</html>
