<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- /creatorsonly/ IS RETIRED (owner, 2026-09-15). The creator app lives on
     the home page: creators sign in or create an account at lynxr.io and land
     in the same app. This stub exists so the links creators were handed, and
     the invite, confirmation and password-reset emails already in inboxes,
     still land somewhere true instead of a 404. forward.js carries the query
     string and the #fragment (where Supabase puts the session) to the home
     page, whose creator.js opens the sign-in card for them. The meta refresh
     is the no-JavaScript fallback; it drops the fragment, so it waits long
     enough for the script to win. noindex; canonical points home. The old
     page is in git history. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lynxr — creators sign in on the home page</title>
<link rel="canonical" href="https://lynxr.io/">
<link rel="stylesheet" href="/app.css?v=202609232m">
<script src="/theme.js?v=202609232m"></script>
<script src="/creatorsonly/forward.js?v=202609232m"></script>
<meta http-equiv="refresh" content="3; url=/">
</head>
<body>
<main class="legal">
  <h1>creators sign in on the home page now</h1>
  <p>if you are not taken there,
    <a href="/">go to lynxr.io</a> &mdash; sign in, or create your account.</p>
</main>
</body>
</html>
