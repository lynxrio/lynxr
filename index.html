  <!-- The one thing this page is for, and now the only thing on it. The
       explanatory paragraph and the three numbered steps were removed: this
       page's whole job is taking an email, and everything else was reading
       between someone and the box. The pitch still travels — it is the og:

       not heard of lynxr actually meet it.
       The app itself is invitation-only while it is early, so there is no
       sign-up link anywhere on the public site. -->
  <section class="wait" id="wait">
    <h3 class="wait-h">lynxr is invite-only right now.</h3>
    <p class="wait-sub">we're working with a small group of creators while it's early.
      leave your email and we'll come to you as we open up.</p>
    <form class="wait-form" id="wait-form" novalidate>
      <input type="email" id="wait-email" placeholder="you@example.com" aria-label="Your email"
             autocomplete="email" autocapitalize="none" autocorrect="off" spellcheck="false" required>
      <button type="submit" class="btn" id="wait-go">join the list</button>
    </form>
    <p class="wait-msg" id="wait-msg" role="status" aria-live="polite"></p>
  </section>
