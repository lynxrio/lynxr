<meta name="description" content="Send any TikTok, Instagram or YouTube link. lynxr pulls out the format underneath it and rewrites it as a script for the brand you're making content for.">

<body>

<main class="home">
  <h1 class="wordmark"><svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M3 3h3l15 15-3 3L3 6zM21 3v3L6 21l-3-3L18 3z"/></svg><span>lynxr<i>.</i></span></h1>

  <h2 class="home-lead">turn any video<br>into your script</h2>

  <!-- The one thing this page is for, and now the only thing on it. The
       explanatory paragraph and the three numbered steps were removed: this
       page's whole job is taking an email, and everything else was reading
       between someone and the box. The pitch still travels — it is the og:
       description that shows in a link preview, which is where people who have
       not heard of lynxr actually meet it.
       The app itself is invitation-only while it is early, so there is no
       sign-up link anywhere on the public site. -->
  <section class="wait" id="wait">
    <h3 class="wait-h">join wait list</h3>
    <!-- This line is also the CONSENT statement — it is the only place a visitor
         is told what their address will be used for, so it defines what you are
         allowed to send. Keep it specific: "launch news and the occasional
         update on what we're shipping" is a real limit. Widening it further
         ("news", "offers", "from our partners") would quietly turn it into
         marketing nobody agreed to.
         CHANGING THE MEANING HERE MEANS BUMPING `CONSENT` IN home.js. Rows
         carry the tag they were signed up under, and older, narrower tags are
         held to their narrower promise — see the privacy page. -->
    <p class="wait-sub">we're still building. leave your email for launch news and
      the occasional update on what we're shipping 🚀</p>
    <form class="wait-form" id="wait-form" novalidate>
      <input type="email" id="wait-email" placeholder="you@example.com" aria-label="Your email"
             autocomplete="email" autocapitalize="none" autocorrect="off" spellcheck="false" required>
      <!-- Icon-only, so aria-label carries the whole meaning: with no text
           inside, a screen reader would otherwise announce this as just
           "button". The heading above already says what pressing it does. -->
      <button type="submit" class="btn" id="wait-go" aria-label="join the wait list" title="join the wait list">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>
    <p class="wait-msg" id="wait-msg" role="status" aria-live="polite"></p>
  </section>

  <p class="home-foot">&copy;
    <a class="entity" href="https://lynxmediagroup.org/" target="_blank" rel="noopener noreferrer">Lynx Media Group LLC</a>
    2026 &middot; <a href="/privacy/">privacy</a></p>
</main>
