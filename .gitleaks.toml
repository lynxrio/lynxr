# Lynxr — gitleaks configuration. See .github/workflows/secret-scan.yml.
[extend]
useDefault = true

# The Supabase PUBLISHABLE key is public by design — it is in twelve HTML
# pages, app.js, creator.js and this repo's README, and it grants an
# anonymous visitor nothing (row-level security is the gate; see
# README.md's security model). gitleaks' default `generic-api-key` rule
# matches it on entropy. Allowlisted BY PREFIX, never by literal value, so
# a real `sb_secret_…` is still caught.
[[allowlists]]
description = "Supabase publishable (anon) key — public by design"
regexes = ['''sb_publishable_[A-Za-z0-9_-]{20,}''']

# `gate13-probe-deliberately-unusable-key` — a literal, non-functional
# placeholder string committed in 6291e28 ("gate 13: throwaway probe for
# the CI paging path") and removed in 5ce9fbb ("remove the gate 13 probe
# workflow"), both on main. It stood in for SUPABASE_SERVICE_ROLE_KEY in a
# throwaway CI job that asserted secrets reach a step — never a real key,
# never usable against the Supabase API. Allowlisted by the exact literal,
# not a prefix, so nothing else is masked.
[[allowlists]]
description = "gate13 probe's deliberately-fake env value — not real key material"
regexes = ['''gate13-probe-deliberately-unusable-key''']

# Names, not secrets — flagged by `generic-api-key` on entropy in 07b162f (post tracking, 2026-10-03), where the
# secret scan reported "Leaks detected". Checked the same day: none of the real values in .env appear anywhere in that
# commit or in HEAD. Each entry is anchored to the WHOLE matched value, so a real key never slips through:
#   - `tracking-stale` / `tracking-budget`: watchdog alarm keys in pipeline/watchdog.py ("key": "tracking-stale").
#   - `lynxr-ab12cd`-style values: fake bio-verification codes in pipeline/test_track_posts.py. Real codes are made
#     by the database for a signed-in creator and are never committed.
#   - `TRACK_*`: environment-variable NAMES in pipeline/envcfg.py's SANITIZED list.
[[allowlists]]
description = "post-tracking names that look random: alarm keys, fake bio codes in tests, env var names"
regexes = [
  '''^tracking-(stale|budget)$''',
  '''^lynxr-[0-9a-z]{6}$''',
  '''^TRACK_[A-Z_]+$''',
]

# More names, not secrets — the scan failed again on 4f5a043 (2026-10-05). Checked the same day: none of the real
# values in .env appear in that commit, in HEAD or in the working tree. Each entry is anchored to the whole value:
#   - `ANTHROPIC_API_KEY`: the environment-variable NAME in .github/workflows/ugc-agent.yml and tools/ugc_agent/.
#   - `P.urllib.request.urlopen`: a function path patched in pipeline/test_link_checks.py.
#   - `lynxr_pending_paste`: a browser storage key name in showcase.js.
#   - `cache_creation_input_tokens`: an Anthropic API usage field name.
[[allowlists]]
description = "names that look random: an env var name, a patched function path, a storage key, an API field"
regexes = [
  '''^ANTHROPIC_API_KEY$''',
  '''^P\.urllib\.request\.urlopen$''',
  '''^lynxr_pending_paste$''',
  '''^cache_creation_input_tokens$''',
]
