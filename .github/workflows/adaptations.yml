# Writes creator scripts on GitHub's runners, so lynxr does not depend on any
# machine of ours being awake. Public repos get unlimited free minutes on
# standard runners, so this costs nothing but the Anthropic spend the worker
# was always going to make.
#
# SECRETS REQUIRED (Settings -> Secrets and variables -> Actions):
#   SUPABASE_SERVICE_ROLE_KEY   bypasses RLS by design — the worker reads and
#                               writes every creator's row
#   ANTHROPIC_API_KEY           format extraction + adaptation
# Fork pull requests never receive secrets, so a drive-by PR cannot read them.

name: creator scripts

# Least privilege: this job never writes to the repo, and it holds
# SUPABASE_SERVICE_ROLE_KEY and ANTHROPIC_API_KEY. Without an explicit block
# GITHUB_TOKEN gets whatever the org/repo default happens to be, which on a
# public repo can be broader than this job ever needs.
permissions:
  contents: read

on:
  schedule:
    # Every 15 minutes — but MEASURED, this fires roughly every 3 hours: runs
    # #4-#7 on 2026-08-12 landed at 05:50, 09:46, 12:34 and 15:44. Scheduled
    # runs on public repos are best-effort and get queued under load, and no
    # cron expression changes that. The job below therefore polls for ~50
    # minutes per firing instead of processing the queue once and exiting,
    # which is what actually closes the gap.
    - cron: "*/15 * * * *"
  # Any push starts a run too. The loop below is self-sustaining ONCE STARTED —
  # each run hands off to the one the concurrency group is holding pending — but
  # something has to start the first one, and waiting on a best-effort cron
  # meant up to three hours of no worker after any gap. Pushing is a thing that
  # already happens, so it costs nobody an action; it also means the chain
  # re-bootstraps by itself if it is ever broken by a failure or a repo change.
  push:
    branches: [main]
  workflow_dispatch:        # a Run workflow button, for when you don't want to wait

concurrency:
  # Two runs processing the same queued adaptation would pay for it twice and
  # race on the write-back. Never run this workflow twice at once.
  group: creator-scripts
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # Just under GitHub's 6-hour ceiling for a single job. Paired with the
    # concurrency group below, this is what makes coverage CONTINUOUS rather
    # than bursty: one run polls for hours while the next firing sits pending,
    # and the moment this job ends the pending one takes over.
    timeout-minutes: 350

    steps:
      # BOUNDED 2026-08-19 — every step before "Write queued scripts" now
      # carries its own timeout. Run #191 proved this is a CLASS of failure,
      # not one bad apt mirror: ANY setup step that hangs holds the
      # concurrency group for the job's whole ~6h ceiling and takes the
      # GitHub fallback worker down with it. See "Install ffmpeg" below for
      # the numbers. Only "Write queued scripts" is meant to run for hours —
      # that is exactly what `timeout-minutes: 350` on the job above is for,
      # and it stays unbounded at the step level on purpose. Every number
      # here is far above what its step has ever measured over the last 18
      # runs.
      # Pinned to a commit SHA, not the mutable @v4 tag — a mutable version
      # tag on a third-party action in a job that holds
      # SUPABASE_SERVICE_ROLE_KEY and ANTHROPIC_API_KEY is a supply-chain
      # hole (a compromised v4 tag could ship anything to this job's
      # environment). SHA below is actions/checkout's v4.4.0 release tag,
      # resolved from the GitHub API on 2026-08-20 (refs/tags/v4.4.0 points
      # at this commit). Bump deliberately by checking the new SHA against a
      # real tag, not by pulling @v4 again. The per-step timeout-minutes
      # below (5 / 5 / 10 / 10) are unchanged by this pin and still bound a
      # hung setup step — see "Install ffmpeg" below for why that matters.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        timeout-minutes: 5          # measured max 2s

      # Pinned to a commit SHA — see fly-deploy.yml's identical step for why
      # and what the SHA below resolves to.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        timeout-minutes: 5          # measured max 9s
        with:
          python-version: "3.12"
          cache: pip
          # setup-python only looks for requirements.txt / pyproject.toml by
          # default, and this repo has neither — the deps live in
          # requirements-ci.txt because the Mac uses ./venv with mlx-whisper
          # instead. Without this the cache step fails the whole job at ~9s.
          cache-dependency-path: requirements-ci.txt

      - name: Install ffmpeg
        # THE STEP THAT ATE SIX HOURS. Run #191 (2026-08-19) entered this
        # step at 08:55:56Z and never left it: `sudo apt-get update` hung,
        # GitHub killed the job 5h55m01s later at 14:50:51Z, and the
        # conclusion was `cancelled` — NOT `failure`, so neither of the two
        # `if: failure()` steps at the bottom of this job ever started and
        # nothing ever decided whether to page. Because
        # `cancel-in-progress: false`, the hung run held the concurrency
        # group the whole time: #192, #193 and #194 were cancelled while
        # pending, and the GitHub fallback worker was dark from 08:41Z (when
        # #183 finished normally at its 350-minute budget) to 14:51Z (when
        # #195 finally took over) — a 6h10m hole in the redundancy. Fly was
        # healthy throughout, which is the only reason no creator felt it.
        #
        # 10 minutes, NOT the 5 that looked obvious. MEASURED over the 17
        # most recent runs that reached this step: 15s min, 29s median,
        # 138s p90 — but 218s on #170 and 406s on #174, both of which went
        # on to finish healthy runs. A 5-minute cap would have killed #174
        # for being slow. 10 minutes is 1.5x the worst real run and about a
        # thirty-fifth of what the hang cost.
        #
        # Tripping this wrongly is cheap: the job goes red, the concurrency
        # group frees at once, and the pending run takes over — #195's job
        # started 4 seconds after #191 was killed. Not tripping costs six
        # hours.
        timeout-minutes: 10
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Install Python deps
        # faster-whisper replaces mlx-whisper here: MLX is Apple-Silicon only,
        # and pipeline/transcribe.py falls back to it automatically.
        timeout-minutes: 10         # measured max 17s; generous for a cold pip cache
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Cache the Whisper weights
        # ~500MB for `small`; downloading it every 15 minutes would dominate
        # the run time and hammer the model host for no reason.
        timeout-minutes: 10         # measured max 12s, but it restores ~500MB
        # Pinned to a commit SHA — see fly-deploy.yml's identical step for why
        # and what the SHA below resolves to.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1

      - name: Write queued scripts
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          WHISPER_MODEL: small
        # Poll for ~5h45m rather than draining the queue once and exiting.
        #
        # MEASURED 2026-08-12: the cron above says every 15 minutes, but real
        # firings landed at 05:50, 09:46, 12:34 and 15:44 — roughly every three
        # hours, because scheduled runs on public repos are best-effort. A run
        # that processes the queue once and exits therefore left ~2h50m of every
        # 3h with no worker at all, and the owner's Mac was quietly covering it.
        # Polling until just short of the job ceiling, with the next firing held
        # pending by the concurrency group, hands over run-to-run instead.
        #
        # A pass that throws must not kill the loop — the next one retries in a
        # minute, and the worker is resume-safe (it claims work before spending).
        # --min-age-seconds 180: Fly owns the first three minutes: it picks up a
        # queued script in ~2s. Without this, a GitHub run that claims an entry
        # first would make that creator wait on GitHub's pace, on a runner with
        # a cold Whisper — racing the very thing whose latency this plan
        # measures, instead of being the backstop it is meant to be.
        #
        # THIS LOOP IS ALSO THE EXTERNAL HALF OF THE WATCHDOG. Fly can die
        # entirely and this keeps running (a GitHub Actions runner, not Fly
        # infrastructure), which is what makes pipeline/watchdog.py's
        # `worker-down` alarm able to fire at all. It is NOT the only caller
        # that can raise it any more — .github/workflows/latency-watch.yml
        # also runs `watchdog.py --once` on its own cron and is a second
        # external caller. `python pipeline/watchdog.py --once --as-fallback`
        # after every pass, `|| true` so a watchdog problem can never fail
        # this loop. `--as-fallback` is what writes `fallback.heartbeat` every
        # ~60s — the signal every other caller reads to decide whether this
        # loop is covering for Fly, instead of paging over a redundancy
        # failure nobody needed to hear about.
        #
        # No longer finishes green while quietly failing. 10 consecutive failed
        # passes (~10 minutes) now fails the job — one bad pass still cannot
        # kill a 5h45m run, that property is deliberate and stays; ten straight
        # is a real outage. `fails=$(( fails + 1 ))`, NEVER `(( fails++ ))` —
        # GitHub runs `run:` steps under `bash -e`, and `(( fails++ ))`
        # evaluates to the PRE-increment value, so it returns exit 1 (killing
        # the whole job) the moment fails goes from 0 to 1.
        run: |
          DEADLINE=$(( SECONDS + 345*60 ))
          fails=0
          while (( SECONDS < DEADLINE )); do
            if python pipeline/process_adaptations.py --min-age-seconds 180; then
              fails=0
            else
              fails=$(( fails + 1 ))
              echo "pass failed ($fails consecutive) — retrying next minute"
              if (( fails >= 10 )); then
                echo "::error::10 consecutive failed passes — failing the run so it is visible"
                exit 1
              fi
            fi
            python pipeline/watchdog.py --once --as-fallback || true
            if (( SECONDS < DEADLINE )); then sleep 60; fi
          done

      - name: Keep the log from a failed run
        if: failure()
        # Pinned to a commit SHA — see fly-deploy.yml's identical step for why
        # and what the SHA below resolves to.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: adaptations-log
          path: output/adaptations.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Page only if a creator is actually affected
        if: failure()
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        # The old step here was an unconditional curl titled "creator-scripts
        # fallback FAILED". It fired whenever this job went red — including
        # when Fly was healthy and every creator had their script, which is the
        # exact page the owner called useless. The decision needs
        # worker.heartbeat out of lynxr_ops, so it lives in Python now.
        #
        # Reachable from a SETUP failure now, not just a worker failure. The
        # step timeouts above turn a hung apt into a step `failure` instead
        # of a job `cancelled`, so this step actually runs — on run #191 it
        # did not, conclusion `None`, never started. That also means it can
        # run BEFORE "Install Python deps", so it has to keep working on a
        # bare setup-python with nothing installed. watchdog.py does: it is
        # stdlib-only plus latency_report and envcfg, and its certifi import
        # is already guarded, falling back to the system CA store that
        # ubuntu-latest always has. DO NOT give this step a dependency.
        run: python pipeline/watchdog.py --ci-failed
