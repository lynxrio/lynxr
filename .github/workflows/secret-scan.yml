# Scans every push and PR for secrets before they land, plus a weekly full-
# history pass. This is prevention, not cleanup — the repo's git history was
# scanned clean (1,935 objects, loose and packed, zero real key material) as
# part of writing this workflow; nothing here is remediating a known leak.
#
# Four things worth knowing before touching this file:
#
#   1. `fetch-depth: 0` on the checkout below is what makes the scheduled
#      (cron) run scan the WHOLE history rather than just one push's commits.
#      A push/PR event already gives gitleaks-action the right commit range
#      on a shallow checkout; the weekly run has no such range to go on.
#
#   2. No GITLEAKS_LICENSE is set or needed. `lynxrio` is a personal GitHub
#      account, not an organization, and gitleaks-action is free for
#      personal accounts on public repos. If this repo is ever transferred
#      to an org, this job starts failing on a missing license — get a free
#      key from gitleaks.io and add it as GITLEAKS_LICENSE in Settings ->
#      Secrets and variables -> Actions.
#
#   3. Pinned to v3, not v2. GitHub removes Node 20 from hosted runners on
#      2026-09-16; v3.0.0 (released 2026-05-30) is v2 rebuilt on Node 24
#      with "no changes to inputs, outputs, or behavior" per its release
#      notes. v2 would start failing on its own around that date regardless
#      of anything in this repo.
#
#   4. DELIBERATELY NO ntfy STEP. Every other workflow here pages the owner
#      on failure; this one must not. The owner's standing rule is that the
#      phone rings only when a creator is affected, which is exactly why
#      adaptations.yml's old unconditional curl was retired (see that file's
#      "Page only if a creator is actually affected" step). A red job here
#      plus GitHub's own failure email is the right channel for a secret
#      scan — it is a repo-hygiene signal, not a creator-impact one.
#
# False positives (the publishable Supabase key, a since-removed probe's
# fake placeholder value) are allowlisted in .gitleaks.toml at the repo
# root, not here — see that file for why each entry is not a secret.

name: secret scan

# Least privilege: this job never writes to the repo. Without an explicit
# block GITHUB_TOKEN gets whatever the org/repo default happens to be.
permissions:
  contents: read

on:
  push:
  pull_request:
  schedule:
    - cron: "23 5 * * 1"     # weekly full-history pass; best-effort, like every cron here
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned to a commit SHA — see fly-deploy.yml's identical step for why
      # and what the SHA below resolves to.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
