# Daily UGC answers for lynxr.io. Writes 2-3 articles that each answer one real
# UGC-creator question, adds each to its /faq/<topic>/ page, and commits STRAIGHT
# TO MAIN (owner decision 2026-10-05: "fully automatic"). This workflow is the only
# thing in the repo that commits; it commits only an allowlisted manifest.
#
# PAUSE: set the repository variable UGC_AGENT_ENABLED to anything but "true"
#        (Settings -> Secrets and variables -> Actions -> Variables), or disable
#        this workflow in the Actions tab.
# UNDO ONE ARTICLE: Run workflow -> mode "withdraw" -> slugs "a,b".
# SECRETS: ANTHROPIC_API_KEY only. Never a Supabase key: this job never reads the database.
name: ugc articles

permissions:
  contents: write     # commit the day's articles to main
  issues: write       # open/update the alert issue when a run fails
  pages: write        # request a Pages build if the push did not start one

on:
  schedule:
    - cron: "17 14 * * *"   # about 10:17 ET; best-effort, like every cron here
  workflow_dispatch:
    inputs:
      mode:
        description: "daily, withdraw or dry-run"
        type: choice
        options: [daily, withdraw, dry-run]
        default: daily
      slugs:
        description: "withdraw only: comma-separated article slugs"
        type: string
        required: false

concurrency:
  group: ugc-agent
  cancel-in-progress: false

jobs:
  run:
    if: github.event_name == 'workflow_dispatch' || vars.UGC_AGENT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      MODE: ${{ inputs.mode || 'daily' }}
      SLUGS: ${{ inputs.slugs }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        timeout-minutes: 5
        with:
          fetch-depth: 40

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        timeout-minutes: 5
        with:
          python-version: "3.12"

      - name: Install the agent's one dependency
        timeout-minutes: 5
        run: python -m pip install -r tools/ugc_agent/requirements.txt

      - name: Restore failed-attempt memory
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/ugc-attempts
          key: ugc-attempts-none
          restore-keys: ugc-attempts-

      - name: Write, gate and render
        timeout-minutes: 30
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UGC_AGENT_PER_DAY: ${{ vars.UGC_AGENT_PER_DAY || '3' }}
          UGC_AGENT_MIN_PASS: ${{ vars.UGC_AGENT_MIN_PASS || '2' }}
          UGC_AGENT_MAX_RUN_USD: ${{ vars.UGC_AGENT_MAX_RUN_USD || '4' }}
        run: |
          mkdir -p "$RUNNER_TEMP/ugc-attempts"
          common=(--manifest "$RUNNER_TEMP/manifest.txt" --summary "$RUNNER_TEMP/summary.md")
          case "$MODE" in
            daily)    python tools/ugc_agent/agent.py daily "${common[@]}" --attempts-cache "$RUNNER_TEMP/ugc-attempts/attempts.json" ;;
            dry-run)  python tools/ugc_agent/agent.py daily --dry-run "${common[@]}" --attempts-cache "$RUNNER_TEMP/ugc-attempts/attempts.json" ;;
            withdraw) python tools/ugc_agent/agent.py withdraw --slugs "$SLUGS" "${common[@]}" ;;
            *) echo "::error::unknown mode $MODE"; exit 1 ;;
          esac

      - name: Save failed-attempt memory
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/ugc-attempts
          key: ugc-attempts-${{ github.run_id }}

      - name: Stamp check (the same rule every commit obeys)
        run: python tools/check_stamp.py

      - name: Keep the rendered pages from a dry run
        if: env.MODE == 'dry-run'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ugc-dry-run
          path: ${{ runner.temp }}/dry-run-out
          if-no-files-found: warn
          retention-days: 7

      - name: Commit only the agent's own files, then push
        if: env.MODE != 'dry-run'
        run: bash tools/ugc_agent/commit.sh "$RUNNER_TEMP/manifest.txt" "$RUNNER_TEMP/commit-subject.txt"

      - name: Wait for the deploy, then IndexNow
        if: env.MODE != 'dry-run'
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/ugc_agent/agent.py publish-check --manifest "$RUNNER_TEMP/manifest.txt" --summary "$RUNNER_TEMP/summary.md"

      - name: Run summary
        if: always()
        run: if [ -f "$RUNNER_TEMP/summary.md" ]; then cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Alert the owner (GitHub issue labelled ugc-agent)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -f "$RUNNER_TEMP/pushed.txt" ]; then body="The UGC answer agent PUSHED $(cat "$RUNNER_TEMP/pushed.txt") to main and then failed (usually: the page was not live in time; IndexNow was skipped). Run: $RUN_URL"; else body="The UGC answer agent failed and committed nothing. Run: $RUN_URL"; fi
          if [ -f "$RUNNER_TEMP/summary.md" ]; then body="$body"$'\n\n'"$(tail -c 6000 "$RUNNER_TEMP/summary.md")"; fi
          gh label create ugc-agent --color B60205 --description "daily UGC answer agent" --force
          n=$(gh issue list --label ugc-agent --state open --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh issue create --title "ugc agent: a run failed" --label ugc-agent --body "$body"; fi
