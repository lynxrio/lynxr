# UGC answers for lynxr.io. The articles are written by a Claude Code CLOUD ROUTINE that runs on the owner's
# subscription (tools/ugc_agent/ROUTINE.md): there is no API key and no model call anywhere in this workflow.
# This workflow does the two jobs a routine cannot, because its sandbox cannot reach lynxr.io or IndexNow:
#   1. publish-check: after a push to main that changes tools/ugc_agent/articles/**, wait until the page is
#      live on lynxr.io (HTML only, never a ?v= asset), then ping IndexNow for the changed pages.
#   2. withdraw: Run workflow -> slugs "a,b" takes live articles down (noindex stub) and pushes that to main.
# SECRETS: none. A push made with the default GITHUB_TOKEN does not start other workflows, which is why the
# withdraw job runs its own publish-check.
name: ugc articles

permissions:
  contents: write     # the withdraw job commits to main
  issues: write       # open/update the alert issue when a run fails
  pages: write        # request a Pages build if a push did not start one

on:
  push:
    branches: [main]
    paths:
      - "tools/ugc_agent/articles/**"
  workflow_dispatch:
    inputs:
      mode:
        description: "withdraw (the only manual mode; articles are written by the Claude Code routine)"
        type: choice
        options: [withdraw]
        default: withdraw
      slugs:
        description: "comma-separated article slugs to withdraw"
        type: string
        required: true

concurrency:
  group: ugc-agent
  cancel-in-progress: false

jobs:
  publish-check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      BEFORE: ${{ github.event.before }}
      AFTER: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        timeout-minutes: 5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        timeout-minutes: 5
        with:
          python-version: "3.12"

      - name: List the pages this push changed
        run: |
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then range="$AFTER^!"; else range="$BEFORE..$AFTER"; fi
          git diff --name-only "$range" | grep -E '^(blog/[a-z0-9-]+/index\.html|blog/index\.html|faq/index\.html|faq/ugc-[a-z-]+/index\.html|tools/ugc_agent/articles/[a-z0-9-]+\.json)$' > "$RUNNER_TEMP/manifest.txt" || true
          echo "changed:"; cat "$RUNNER_TEMP/manifest.txt"

      - name: Wait for the deploy, then IndexNow
        timeout-minutes: 25
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ugc_agent/agent.py publish-check --manifest "$RUNNER_TEMP/manifest.txt"

      - name: Alert the owner (GitHub issue labelled ugc-agent)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="A push to main published UGC answers but the page was not live in time (or IndexNow failed). Run: $RUN_URL"
          gh label create ugc-agent --color B60205 --description "UGC answer agent" --force
          n=$(gh issue list --label ugc-agent --state open --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh issue create --title "ugc agent: publish check failed" --label ugc-agent --body "$body"; fi

  withdraw:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      SLUGS: ${{ inputs.slugs }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        timeout-minutes: 5
        with:
          fetch-depth: 40

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        timeout-minutes: 5
        with:
          python-version: "3.12"

      - name: Withdraw, render and gate
        run: python3 tools/ugc_agent/agent.py withdraw --slugs "$SLUGS" --manifest "$RUNNER_TEMP/manifest.txt" --summary "$RUNNER_TEMP/summary.md"

      - name: Stamp check (the same rule every commit obeys)
        run: python3 tools/check_stamp.py

      - name: Commit only the withdrawn pages, then push
        run: bash tools/ugc_agent/commit.sh "$RUNNER_TEMP/manifest.txt" "$RUNNER_TEMP/commit-subject.txt"

      - name: Wait for the deploy, then IndexNow
        timeout-minutes: 25
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ugc_agent/agent.py publish-check --manifest "$RUNNER_TEMP/manifest.txt"

      - name: Run summary
        if: always()
        run: if [ -f "$RUNNER_TEMP/summary.md" ]; then cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Alert the owner (GitHub issue labelled ugc-agent)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -f "$RUNNER_TEMP/pushed.txt" ]; then body="The withdraw PUSHED $(cat "$RUNNER_TEMP/pushed.txt") to main and then failed (usually: the page was not live in time; IndexNow was skipped). Run: $RUN_URL"; else body="The withdraw failed and committed nothing. Run: $RUN_URL"; fi
          gh label create ugc-agent --color B60205 --description "UGC answer agent" --force
          n=$(gh issue list --label ugc-agent --state open --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh issue create --title "ugc agent: withdraw failed" --label ugc-agent --body "$body"; fi
