# THROWAWAY — gate 13. Lives ONLY on the branch `gate13-ci-page-probe` and
# must never reach `main`. Delete the branch once the run has been read.
#
# WHY: `pipeline/watchdog.py --ci-failed` is wired into adaptations.yml
# (line 198) and latency-watch.yml (line 77) behind `if: failure()` and has
# NEVER executed on GitHub — every `creator scripts` run since it was wired
# (commit d7ba7a2, 2026-08-19T02:54Z) concluded `success` or `cancelled`,
# and a cancelled job skips `if: failure()` entirely. This workflow copies
# that step's exact `if:`, `env:` and `run:` and then fails on purpose,
# five ways, so the path executes for the first time somewhere harmless.
#
# Jobs are CHAINED, not parallel, on purpose: if Fly happened to go down
# mid-probe, three parallel jobs could each find the `alarm.worker-down`
# latch closed and turn one correct page into three.

name: gate 13 ci page probe

permissions:
  contents: read

on:
  push:
    branches: [gate13-ci-page-probe]

concurrency:
  group: gate13-ci-page-probe
  cancel-in-progress: true

jobs:
  exit1:
    name: "1 - ordinary red job, deps never installed"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Force the job red
        run: |
          echo "deliberate failure - gate 13 probe"
          exit 1

      # COPIED VERBATIM from adaptations.yml lines 198-202 + its `run:`
      # (comments stripped). Do not alter the `if:`, the `env:` keys or the
      # `run:` line. Identical to latency-watch.yml lines 77-90.
      - name: Page only if a creator is actually affected
        if: failure()
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python pipeline/watchdog.py --ci-failed

      - name: ASSERT the secrets arrived and the verdict was fly-covering
        if: always()
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python -c "import os,sys;t=os.environ.get('NTFY_TOPIC','').strip();print('NTFY_TOPIC reached this step:',bool(t));sys.exit(0 if t else 1)"
          python -c "import os,sys;t=os.environ.get('SUPABASE_SERVICE_ROLE_KEY','').strip();print('SUPABASE key reached this step:',bool(t));sys.exit(0 if t else 1)"
          out=$(python pipeline/watchdog.py --ci-failed)
          echo "$out"
          echo "$out" | grep -q "^why: fly-covering$"
          echo "$out" | grep -q "no page"

  steptimeout:
    name: "2 - step killed by timeout-minutes (the run #191 shape)"
    needs: exit1
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # THE CLAIM UNDER TEST. Run #191's `Install ffmpeg` hung and the job
      # concluded `cancelled`, so no `if: failure()` step ever started. The
      # fix assumes a STEP timeout produces `failure` instead. Nothing in
      # this repo has ever observed that.
      - name: Hang like run 191's apt-get
        timeout-minutes: 1
        run: |
          echo "sleeping 300s under a 1-minute step timeout"
          sleep 300

      - name: Page only if a creator is actually affected
        if: failure()
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python pipeline/watchdog.py --ci-failed

      - name: ASSERT the verdict was fly-covering
        if: always()
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          out=$(python pipeline/watchdog.py --ci-failed)
          echo "$out"
          echo "$out" | grep -q "^why: fly-covering$"

  nosetuppython:
    name: "3 - setup-python never ran (the case where IT is what timed out)"
    needs: steptimeout
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Force the job red
        run: exit 1

      # No setup-python above. If `actions/setup-python` is the step that
      # times out in the real workflow, this is the environment the page
      # step actually gets. OUTCOME UNKNOWN AND THAT IS THE POINT - record
      # this step's conclusion either way, do not fix it here.
      - name: Page only if a creator is actually affected
        if: failure()
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python pipeline/watchdog.py --ci-failed

      - name: Record what python looks like on a bare runner
        if: always()
        run: |
          echo "command -v python  -> $(command -v python || echo MISSING)"
          echo "command -v python3 -> $(command -v python3 || echo MISSING)"
          python3 -V

  pagebranch:
    name: "4 - the PAGING branch, on a throwaway ntfy topic"
    needs: nosetuppython
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Force the job red
        run: exit 1

      # Same `if:` and the SAME `run:` line as production. Only the two env
      # VALUES differ, deliberately:
      #   - an unusable Supabase key, so _ops_probe() fails and
      #     ci_failure_verdict() takes its `ci-unverified` branch (page:
      #     True, priority 4). raise_alarm()'s ops_get/ops_put fail with the
      #     same key and fall back to the in-process _LOCAL_LATCH, so this
      #     job CANNOT leave a latch open in lynxr_ops. That is by design.
      #   - a throwaway ntfy topic, so the real page lands somewhere we can
      #     read back instead of on the owner's phone. The topic protects
      #     nothing and carries no PII; it dies with the branch.
      - name: Page only if a creator is actually affected
        if: failure()
        env:
          SUPABASE_SERVICE_ROLE_KEY: gate13-probe-deliberately-unusable-key
          NTFY_TOPIC: lynxr-gate13-page-796f3e7b24
        run: python pipeline/watchdog.py --ci-failed

      - name: ASSERT the page actually landed on ntfy
        if: always()
        run: |
          for i in 1 2 3 4 5 6; do
            sleep 5
            body=$(curl -s -m 15 "https://ntfy.sh/lynxr-gate13-page-796f3e7b24/json?poll=1")
            echo "poll $i: $body"
            if echo "$body" | grep -q "could not verify whether a creator is affected"; then
              n=$(echo "$body" | grep -c '"event":"message"')
              echo "messages on the probe topic: $n"
              test "$n" -eq 1
              echo "$body" | grep -q '"priority":4'
              exit 0
            fi
          done
          echo "no page landed on the probe topic"
          exit 1

  flycurl:
    name: "5 - the fly-deploy / fly-refresh curl shape"
    needs: pagebranch
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Force the job red
        run: exit 1

      # Byte-identical to fly-deploy.yml's and fly-refresh.yml's
      # `Say so on the owner's phone` step apart from the topic (a second
      # throwaway, so job 4's "exactly 1 message" assertion stays clean and
      # the phone stays quiet). Substituting a literal for
      # ${{ secrets.NTFY_TOPIC }} loses nothing: secret-expression
      # interpolation into a `run:` script is already proven by
      # adaptations.yml's old curl, which paged the owner on runs #168-#182.
      - name: Say so on the owner's phone
        if: failure()
        run: |
          curl -s -m 10 \
            -H "Title: lynxr: worker DEPLOY failed" \
            -H "Priority: 4" -H "Tags: rotating_light" \
            -d "run ${{ github.run_number }} - github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "https://ntfy.sh/lynxr-gate13-fly-2ed113ef90" > /dev/null

      - name: ASSERT it landed
        if: always()
        run: |
          for i in 1 2 3 4 5 6; do
            sleep 5
            body=$(curl -s -m 15 "https://ntfy.sh/lynxr-gate13-fly-2ed113ef90/json?poll=1")
            echo "poll $i: $body"
            if echo "$body" | grep -q "worker DEPLOY failed"; then exit 0; fi
          done
          echo "no page landed on the fly probe topic"
          exit 1

  selftest:
    name: "6 - --self-test with the REAL secrets (this rings the phone twice)"
    needs: flycurl
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The ONLY job that touches the owner's phone or production
      # lynxr_ops. It closes the one risk the jobs above cannot: that the
      # `NTFY_TOPIC` repo secret holds a value the owner's phone is
      # actually subscribed to. Both messages label themselves as a
      # self-test in their own body text. LAST in the chain on purpose:
      # if anything above is wrong, the phone never rings at all.
      #
      # Note this job is NOT forced red - it must finish green.
      - name: Real ntfy topic plus the lynxr_ops latch, from a runner
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python pipeline/watchdog.py --self-test
